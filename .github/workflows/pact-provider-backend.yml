name: Pact Provider (backend)

# Self-contained local provider verification: this workflow installs all three
# consumers, generates their pact files in the runner, then verifies the backend
# against the documented baseline. No Pact Broker is required for the seminar.
on:
    workflow_dispatch:
    push:
        paths:
            - 'Sut/EShop/backend/**'
            - 'Sut/EShop/frontend-web/**'
            - 'Sut/EShop/frontend-admin/**'
            - 'Sut/EShop/frontend-mobile/**'
            - 'Sut/EShop/run_tests.sh'
            - '.github/workflows/pact-provider-backend.yml'
    pull_request:
        paths:
            - 'Sut/EShop/backend/**'
            - 'Sut/EShop/frontend-web/**'
            - 'Sut/EShop/frontend-admin/**'
            - 'Sut/EShop/frontend-mobile/**'
            - 'Sut/EShop/run_tests.sh'
            - '.github/workflows/pact-provider-backend.yml'

jobs:
    verify:
        runs-on: ubuntu-latest
        env:
            GIT_SHA: ${{ github.sha }}
            GIT_BRANCH: ${{ github.ref_name }}
            CI: 'true'
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: |
                      Sut/EShop/backend/package-lock.json
                      Sut/EShop/frontend-web/package-lock.json
                      Sut/EShop/frontend-admin/package-lock.json
                      Sut/EShop/frontend-mobile/package-lock.json

            - name: Install backend dependencies
              working-directory: Sut/EShop/backend
              run: npm ci

            - name: Install frontend-web dependencies
              working-directory: Sut/EShop/frontend-web
              run: npm ci

            - name: Install frontend-admin dependencies
              working-directory: Sut/EShop/frontend-admin
              run: npm ci

            - name: Install frontend-mobile dependencies
              working-directory: Sut/EShop/frontend-mobile
              run: npm ci

            - name: Generate local pacts and verify provider baseline
              working-directory: Sut/EShop
              run: bash ./run_tests.sh
