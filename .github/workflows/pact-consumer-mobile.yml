name: Pact Consumer (mobile)

on:
    push:
        paths:
            - 'Sut/EShop/frontend-mobile/**'
            - 'Sut/EShop/backend/**'
            - '.github/workflows/pact-consumer-mobile.yml'
    pull_request:
        paths:
            - 'Sut/EShop/frontend-mobile/**'
            - 'Sut/EShop/backend/**'

jobs:
    consumer:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: Sut/EShop/frontend-mobile
        env:
            PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
            PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
            GIT_SHA: ${{ github.sha }}
            GIT_BRANCH: ${{ github.ref_name }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: Sut/EShop/frontend-mobile/package-lock.json

            - run: npm ci

            - name: Generate pact files
              run: npm run test:pact

            - name: Install backend dependencies
              working-directory: Sut/EShop/backend
              run: npm ci

            - name: Verify contract against provider
              # No broker needed: this consumer's pact file was just generated
              # above and both frontend and backend are already checked out in
              # this same job/runner. continue-on-error is intentional: the
              # documented baseline has known, tagged failures (see
              # EShop_Pact_Plan.md / EShop_Defect.md) that are expected, not a
              # regression signal -- read the step's own log output for the
              # real pass/fail breakdown rather than the green/red job status.
              working-directory: Sut/EShop/backend
              continue-on-error: true
              env:
                  PACT_VERIFY_ONLY: eshop-mobile
              run: node pact/provider.verify.js

            - name: Publish pact to broker
              if: env.PACT_BROKER_BASE_URL != ''
              run: |
                  npx --yes @pact-foundation/pact-cli \
                    pact-broker publish ./pacts \
                    --consumer-app-version="$GIT_SHA" \
                    --branch="$GIT_BRANCH" \
                    --broker-base-url="$PACT_BROKER_BASE_URL" \
                    --broker-token="$PACT_BROKER_TOKEN"

            - name: can-i-deploy
              if: env.PACT_BROKER_BASE_URL != ''
              continue-on-error: true # advisory only; hard deployment gate remains out of scope
              run: |
                  npx --yes @pact-foundation/pact-cli \
                    pact-broker can-i-deploy \
                    --pacticipant eshop-mobile \
                    --version "$GIT_SHA" \
                    --to-environment production \
                    --broker-base-url="$PACT_BROKER_BASE_URL" \
                    --broker-token="$PACT_BROKER_TOKEN"
