    /api/cart:
        get:
            tags: [Cart]
            x-apidog-status: designing
            summary: Get the current user's in-memory cart
            description:
                The cart is stored in a plain in-memory JS object and is lost on
                server restart.
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: Cart items (may be an empty array).
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Cart' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }

        post:
            tags: [Cart]
            x-apidog-status: designing
            summary: Push an item onto the current user's cart
            description: |
                The backend appends `req.body` verbatim to the cart array; it does
                not merge duplicate product ids (spec FR-07 requires merging —
                implementation defect). No schema validation is performed on the
                request body.
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/CartItem' }
                        examples:
                            success:
                                summary: Valid item, quantity 1
                                value:
                                    {
                                        id: 1,
                                        name: 'Sample Product',
                                        price: 100000,
                                        quantity: 1,
                                    }
                            invalidZeroQuantity:
                                summary:
                                    Zero quantity (single field mutated,
                                    boundary)
                                value:
                                    {
                                        id: 1,
                                        name: 'Sample Product',
                                        price: 100000,
                                        quantity: 0,
                                    }
                            invalidNegativeQuantity:
                                summary:
                                    Negative quantity (single field mutated,
                                    invalid class)
                                value:
                                    {
                                        id: 1,
                                        name: 'Sample Product',
                                        price: 100000,
                                        quantity: -1,
                                    }
            responses:
                '200':
                    description: Item pushed.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Message' }
                            example: { message: 'Added to cart' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/checkout:
        post:
            tags: [Orders]
            x-apidog-status: designing
            summary: Place an order
            description: |
                Creates a new order with status `pending`. The server trusts the
                `total_amount` sent by the client (spec FR-08 defect). The cart is
                not cleared after checkout, and cart items are not linked to the
                created order.
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/CheckoutRequest' }
                        examples:
                            success:
                                summary: Valid checkout
                                value:
                                    {
                                        total_amount: 100000,
                                        shipping_address:
                                            '123 Test Street, District 1, HCMC',
                                    }
            responses:
                '200':
                    description: Order created.
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: '#/components/schemas/CheckoutResponse',
                                }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '500': { $ref: '#/components/responses/ServerError' }

    /api/orders/my-orders:
        get:
            tags: [Orders]
            x-apidog-status: designing
            summary: List the current user's orders
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: Array of orders ordered by id DESC.
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/Order' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/orders/{id}/cancel:
        parameters:
            - in: path
              name: id
              required: true
              schema: { type: integer }
        put:
            tags: [Orders]
            x-apidog-status: designing
            summary: Cancel an order (user-initiated)
            description: |
                Sets the order status to `canceled`. Implementation only refuses the
                transition when the current status is `delivered` or `canceled`,
                meaning a user can still cancel a `shipping` order (spec FR-10 defect).
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: Order canceled.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Message' }
                            example: { message: 'Order canceled successfully' }
                '400':
                    description: Order is already `delivered` or `canceled`.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                            example: { error: 'Cannot cancel this order.' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404':
                    description:
                        Order not found or does not belong to the current user.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                            example: { error: 'Order not found' }

    /api/orders/{id}:
        parameters:
            - in: path
              name: id
              required: true
              schema: { type: integer }
        get:
            tags: [Orders]
            x-apidog-status: designing
            summary: Get an order by id
            description: |
                Spec: only the order owner or an admin should be able to read this.
                Implementation: no auth check — any caller can read any order.
            security: []
            responses:
                '200':
                    description: Order details.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Order' }
                '404':
                    description: Order not found.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                            example: { error: 'Order not found' }

    /api/coupons:
        get:
            tags: [Coupons]
            x-apidog-status: designing
            summary: List all coupons
            description: |
                Requires a valid JWT (but no role check — spec says admin only).
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: Array of coupons.
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/Coupon' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/apply-coupon:
        post:
            tags: [Coupons]
            x-apidog-status: designing
            summary: Apply a coupon code and preview the discount
            description: |
                Evaluates a coupon against the given `total_amount` and optional
                `user_id`. Implementation quirks vs. spec FR-09:

                - `total_amount > min_order_amount` is used instead of `>=`.
                - For `percent` coupons the discount is computed as
                  `floor(total * (1 - discount_value))`, inverting the intended
                  formula: `discount_value = 10` produces a *negative* discount and
                  a `final_amount` **larger than the original**.
                - `user_id` is optional; when omitted the `max_uses_per_user`
                  limit is not enforced.
                - Expiry is checked after the minimum-threshold check, so an
                  expired coupon on a small order returns "below minimum" rather
                  than "expired."
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            { $ref: '#/components/schemas/ApplyCouponRequest' }
                        examples:
                            success:
                                summary: Valid coupon on a qualifying order
                                value:
                                    {
                                        code: 'SAVE10',
                                        total_amount: 500000,
                                        user_id: 1,
                                    }
                            missingCode:
                                summary:
                                    Empty code (matches the missingCode 400
                                    response)
                                value:
                                    {
                                        code: '',
                                        total_amount: 500000,
                                        user_id: 1,
                                    }
                            belowMinimum:
                                summary:
                                    Order under the coupon's minimum (matches
                                    the belowMinimum 400 response)
                                value:
                                    {
                                        code: 'SAVE10',
                                        total_amount: 10000,
                                        user_id: 1,
                                    }
                            omittedUserId:
                                summary:
                                    user_id omitted — silently bypasses the
                                    max-uses-per-user check (FR-09 C5 defect)
                                value: { code: 'SAVE10', total_amount: 500000 }
            responses:
                '200':
                    description: Coupon applied successfully.
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: '#/components/schemas/ApplyCouponSuccess',
                                }
                '400':
                    description: |
                        Missing code, order under `min_order_amount`, coupon expired,
                        or per-user usage limit reached.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                            examples:
                                missingCode:
                                    value:
                                        { error: 'Vui lòng nhập mã giảm giá' }
                                belowMinimum:
                                    value:
                                        {
                                            error:
                                                'Đơn hàng chưa đủ giá trị tối
                                                thiểu 300,000 ₫ để áp dụng mã
                                                này',
                                        }
                                expired:
                                    value: { error: 'Mã giảm giá đã hết hạn' }
                                limitReached:
                                    value:
                                        {
                                            error:
                                                'Bạn đã sử dụng mã này 1 lần (đã
                                                đạt giới hạn)',
                                        }
                '404':
                    description: Coupon code does not exist or is disabled.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                            example:
                                {
                                    error:
                                        'Mã giảm giá không tồn tại hoặc đã bị vô
                                        hiệu hóa',
                                }

    /api/coupon-usage:
        post:
            tags: [Coupons]
            x-apidog-status: designing
            summary: Record a coupon usage (call after successful checkout)
            description: |
                Inserts into `coupon_usage` on demand with no cross-reference to any
                real order. A client can bump their own counter arbitrarily or skip
                this endpoint entirely for unlimited real uses.
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            { $ref: '#/components/schemas/CouponUsageRequest' }
                        examples:
                            success:
                                summary: Record usage for a known coupon
                                value: { coupon_id: 1 }
            responses:
                '200':
                    description: Usage recorded.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Message' }
                            example: { message: 'Usage recorded' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '500': { $ref: '#/components/responses/ServerError' }

    /api/admin/coupons:
