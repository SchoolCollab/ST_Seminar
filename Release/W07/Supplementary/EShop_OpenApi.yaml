                '403': { $ref: '#/components/responses/Forbidden' }
                '500': { $ref: '#/components/responses/ServerError' }

    /api/admin/users:
        get:
            tags: [Admin]
            x-apidog-status: designing
            summary: List all users (Admin)
            description:
                Auth required; role is not verified in the implementation.
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: Array of users (password omitted).
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    { $ref: '#/components/schemas/AdminUser' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/admin/users/{id}:
        parameters:
            - in: path
              name: id
              required: true
              schema: { type: integer }
        delete:
            tags: [Admin]
            x-apidog-status: designing
            summary: Delete a user (Admin)
            description: |
                Implementation does not verify admin role and does not prevent an
                admin from deleting their own account (spec FR-19 defect). Always
                returns 200 even when the id did not exist.
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: User deleted.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Message' }
                            example: { message: 'User deleted' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/admin/orders:
        get:
            tags: [Admin]
            x-apidog-status: designing
            summary: List all orders (Admin)
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: Array of orders joined with user name.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    { $ref: '#/components/schemas/AdminOrder' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /api/admin/orders/{id}/status:
        parameters:
            - in: path
              name: id
              required: true
              schema: { type: integer }
        put:
            tags: [Admin]
            x-apidog-status: designing
            summary: Update order status (Admin)
            description: |
                Allowed transitions in the current implementation:

                - `pending` → `confirmed` | `canceled`
                - `confirmed` → `shipping` | `canceled`
                - `shipping` → `delivered`
                - `canceled` → `delivered` (bug — spec FR-10 forbids this;
                  `canceled` and `delivered` should be final states)

                All other transitions return `400 Invalid state transition`.
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: '#/components/schemas/UpdateOrderStatusRequest',
                            }
                        examples:
                            validTransition:
                                summary: pending → confirmed (legal)
                                value: { status: 'confirmed' }
                            illegalTransition:
                                summary:
                                    pending → delivered (correctly rejected,
                                    400)
                                value: { status: 'delivered' }
                            bugTransition:
                                summary:
                                    canceled → delivered (incorrectly allowed —
                                    FR-10 defect; send against a canceled order)
                                value: { status: 'delivered' }
            responses:
                '200':
                    description: Status updated.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Message' }
                            example: { message: 'Order status updated' }
                '400':
                    description: Requested transition is not allowed.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                            example:
                                {
                                    error:
                                        'Invalid state transition from pending
                                        to shipping',
                                }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404':
                    description: Order not found.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                            example: { error: 'Order not found' }
