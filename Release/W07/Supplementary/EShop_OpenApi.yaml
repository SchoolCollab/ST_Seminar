                            example: { message: 'Coupon created', id: 5 }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '500':
                    description: DB error (e.g. duplicate `code`).
                    content:
