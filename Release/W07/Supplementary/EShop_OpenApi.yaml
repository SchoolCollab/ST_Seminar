        delete:
            tags: [Coupons]
            x-apidog-status: designing
            summary: Delete a coupon (Admin)
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: Coupon deleted.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Message' }
